name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Cloudless.sln
      - name: Build
        run: dotnet build Cloudless.sln --configuration ${{ matrix.configuration }} --no-restore
      - name: Test
        run: dotnet test Cloudless.Tests/Cloudless.Tests.csproj --configuration ${{ matrix.configuration }} --no-build
